name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/original-ui-langchain-agent

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            visualization_app/requirements.txt
            interface_monitor_demo/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check changed lines for whitespace errors
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } else {
            git diff --check "${{ github.event.before }}...HEAD"
          }

      - name: Install portable test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r visualization_app/requirements.txt
          python -m pip install -r interface_monitor_demo/requirements.txt

      - name: Run Harness core contracts
        shell: pwsh
        run: |
          python -m unittest `
            harness.tests.test_entrypoint_contract `
            harness.tests.test_matrix `
            harness.tests.test_quality_gate_cli `
            harness.tests.test_reporting `
            harness.tests.test_runner `
            -v

      - name: Run CI-supported project checks
        shell: pwsh
        run: |
          $checks = @(
            "pre-sensor-endurance-unit-contracts",
            "pre-sensor-field-operations-contracts",
            "real-acquisition-mode-contracts",
            "real-acquisition-local-direct-contracts",
            "real-acquisition-remote-helper-contracts",
            "real-acquisition-mode-equivalence-contracts",
            "modular-runtime-contracts",
            "interface-monitor-contracts",
            "usb-dock-topology-contracts",
            "frontend-behavior-contracts",
            "native-function-contracts",
            "frontend-public-contracts",
            "diagnosis-interface-contracts",
            "edge-helper-websocket-contracts",
            "real-acquisition-protocol-contracts",
            "thermocouple64-protocol-contracts",
            "thermocouple64-layer-projection-contracts",
            "thermocouple64-frontend-contracts"
          )
          foreach ($check in $checks) {
            ./harness/engine/run.ps1 -Check $check -Environment ci
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload quality-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            harness/logs/
            harness/reports/
          if-no-files-found: warn
